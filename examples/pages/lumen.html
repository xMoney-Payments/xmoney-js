<section class="-mx-10 -mb-16 min-h-full bg-[#f4f3fb] px-10 pt-8 pb-16 text-[#16141a] wide:-mt-8 dark:bg-[#09090b] dark:text-[#fafafa]" data-page="store" data-brand="lumen" style="--accent:#7c4dff;--on-accent:#fff">
  <header class="mb-7 flex items-end justify-between gap-4">
    <div>
      <p class="mb-1.5 text-xs font-bold tracking-[0.1em] text-black/55 uppercase dark:text-zinc-400">Example app</p>
      <h1 class="text-[32px] leading-[1.05] font-bold tracking-[-0.03em]">Lumen</h1>
      <p class="mt-1.5 text-black/55 dark:text-zinc-400">Modern essentials. Add a piece, then check out.</p>
    </div>
    <button class="cursor-pointer rounded-full border border-black/[0.08] bg-transparent px-[18px] py-3 font-semibold dark:border-white/12" type="button" data-test-cards>Test cards</button>
  </header>
  <div data-catalog>
    <div class="grid grid-cols-[repeat(auto-fill,minmax(200px,1fr))] gap-4" data-products></div>
    <button class="sticky bottom-4 mt-6 w-full cursor-pointer rounded-full bg-(--accent) px-[18px] py-3 font-semibold text-(--on-accent) hover:brightness-95 disabled:cursor-default disabled:opacity-45" type="button" data-open-cart hidden>Cart</button>
  </div>
  <div class="grid items-start gap-6 wide:grid-cols-[minmax(0,1fr)_minmax(280px,448px)]" data-store-stage hidden>
    <section>
      <button class="mb-4 text-sm font-semibold" type="button" data-back-shop>← Shop</button>
      <aside class="rounded-3xl border border-black/[0.08] bg-white p-5 wide:sticky wide:top-6 dark:border-white/12 dark:bg-[#18181b]">
        <p class="mb-1.5 text-xs font-bold tracking-[0.1em] text-black/55 uppercase dark:text-zinc-400">Cart</p>
        <ul class="my-3 grid list-none gap-2.5 p-0" data-cart-lines></ul>
        <div class="mt-2 mb-3.5 flex justify-between text-base"><span>Total</span><strong data-cart-total></strong></div>
      </aside>
    </section>
    <section class="flex justify-center">
      <div class="w-full max-w-[448px]">
        <div class="relative w-full">
          <div class="widget-border">
            <div class="widget-glow" aria-hidden="true"></div>
            <div class="relative h-auto rounded-3xl bg-white px-6 pt-6 pb-5 text-[#16141a] dark:bg-[#18181b] dark:text-[#fafafa]">
              <div class="widget-bloom" aria-hidden="true"></div>
              <div class="relative z-[1] flex flex-col gap-4">
                <div class="checkout-stage">
                  <div data-loading></div>
                  <div class="checkout-slot" id="checkout"></div>
                </div>
                <p class="my-3 rounded-xl bg-[#ff4757]/12 px-3 py-2.5 text-sm text-[#ff4757]" data-error hidden></p>
                <div data-result hidden></div>
                <button class="mt-4 cursor-pointer rounded-full border border-black/[0.08] bg-transparent px-[18px] py-3 font-semibold disabled:cursor-default disabled:opacity-45 dark:border-white/12" type="button" data-restart hidden>New payment</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>
