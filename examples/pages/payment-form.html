<section class="mx-auto max-w-[1040px]" data-page="payment-form">
  <header class="mb-7 flex items-start justify-between gap-4">
    <div>
      <h1 class="text-[32px] leading-[1.05] font-bold tracking-[-0.03em]">Payment form</h1>
      <p class="mt-1.5 max-w-[62ch] text-black/55 dark:text-zinc-400">Drop-in <code>paymentForm</code>. The SDK renders the card fields and Pay button.</p>
    </div>
    <button class="cursor-pointer rounded-full border border-black/[0.08] bg-transparent px-[18px] py-3 font-semibold dark:border-white/12" type="button" data-test-cards>Test cards</button>
  </header>
  <div class="grid items-start gap-7 wide:grid-cols-[minmax(0,1fr)_minmax(320px,1fr)]">
    <div class="min-w-0">
      <section class="rounded-3xl border border-black/[0.08] bg-white p-5 dark:border-white/12 dark:bg-[#18181b]">
        <p class="mb-1.5 text-xs font-bold tracking-[0.1em] text-black/55 uppercase dark:text-zinc-400">Order summary</p>
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="text-lg font-bold tracking-[-0.02em]">Sample order</h2>
            <p class="mt-1 text-black/55 dark:text-zinc-400">Qty 1</p>
          </div>
          <p class="shrink-0 font-semibold">€19.99</p>
        </div>
        <div class="mt-4 space-y-2 border-t border-black/[0.08] pt-4 text-sm dark:border-white/12">
          <div class="flex justify-between gap-3"><span class="text-black/55 dark:text-zinc-400">Subtotal</span><span>€19.99</span></div>
          <div class="flex items-start justify-between gap-3"><span class="text-black/55 dark:text-zinc-400">Tax</span><span class="text-right text-xs text-black/55 dark:text-zinc-400">Enter address to calculate</span></div>
          <div class="flex items-baseline justify-between gap-3 border-t border-black/[0.08] pt-3 dark:border-white/12"><span class="font-semibold">Total due</span><span class="text-[28px] leading-none font-bold tracking-[-0.03em]">€19.99</span></div>
        </div>
      </section>
    </div>
    <div class="flex min-w-0 justify-center">
      <div class="relative w-full">
        <div class="widget-border">
          <div class="widget-glow" aria-hidden="true"></div>
          <div class="relative h-auto rounded-3xl bg-white px-6 pt-6 pb-5 text-[#16141a] dark:bg-[#18181b] dark:text-[#fafafa]">
            <div class="widget-bloom" aria-hidden="true"></div>
            <div class="relative z-[1] flex flex-col gap-4">
              <div class="checkout-stage">
                <div data-loading></div>
                <div class="checkout-slot" id="checkout"></div>
              </div>
              <p class="my-3 rounded-xl bg-[#ff4757]/12 px-3 py-2.5 text-sm text-[#ff4757]" data-error hidden></p>
              <div data-result hidden></div>
              <button class="mt-4 cursor-pointer rounded-full border border-black/[0.08] bg-transparent px-[18px] py-3 font-semibold disabled:cursor-default disabled:opacity-45 dark:border-white/12" type="button" data-restart hidden>New payment</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
